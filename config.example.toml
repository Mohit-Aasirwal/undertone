# Undertone configuration. Copy to ~/.config/undertone/config.toml and restart undertone.
# List your monitors with:  undertone --list-monitors

# Which monitors get a lyrics box: "all", "primary", or a list of names/indices,
# e.g. ["HDMI-A-0"] or [0, 1] or ["DP-1-0", 0]
monitors = "all"

[window]
# Box width: "fill", pixels (1280), or percent of the monitor ("70%")
width = "fill"
# Box height: same forms as width. Leave unset to derive it from ratio, or to fill.
# height = 720
# Aspect ratio used when height is unset, e.g. "16:9", "4:3", "21:9", "1:1"
# ratio = "16:9"
# Where the box sits: center, top, bottom, left, right, top-left, top-right, bottom-left, bottom-right
anchor = "center"
# Gap in pixels between the box and the monitor edges
margin = 0
# Text/UI scale. Unset means proportional to box height (1.0 at 1080px tall).
# scale = 1.0

# Per-monitor overrides go in a sub-table named after the monitor (name or index).
# Any key from [window] can be overridden here.
#
# [window.DP-1-0]
# width = "60%"
# ratio = "16:9"
# anchor = "bottom-right"
# margin = 40

[visualizer]
# Concentric rings behind the lyrics, driven by the audio playing on the default output.
enabled = true
# Number of rings; inner rings follow bass, outer rings follow treble
rings = 10
# Stroke opacity (0..1). Keep it low for a faint grey look.
opacity = 0.2
# Starting mode: "rings", "bars", "wave" or "particles". Cycle at runtime with `undertone ctl cycle-vis`.
mode = "rings"
# Animation frame rate (5..60). Lower it on a weak machine; 24 still looks smooth.
fps = 30

[players]
# Which MPRIS players count. Case-insensitive substring match on the player's bus name
# (e.g. "spotify", "brave", "firefox", "vlc"). Empty lists mean every player counts.
# deny = ["firefox"]          # ignore these players
# allow = ["spotify", "brave"]  # only these players
allow = []
deny = []

[theme]
# Where the accent colour (current line, ring tint, backdrop glow) comes from:
# "art" = extracted from the album cover, "gtk" = your GTK theme's selection colour, "none" = neutral grey
source = "art"

[lyrics]
# Sources tried in order; the first one with lyrics wins.
#   "local"   .lrc next to the playing file, or "<Artist> - <Title>.lrc" / "<Title>.lrc" in local_dirs
#   "lrclib"  lrclib.net (free, synced lyrics)
#   "netease" music.163.com (synced lyrics, best effort; blocked in some regions)
sources = ["local", "lrclib", "netease"]
local_dirs = ["~/Music"]

[translation]
# Show a faint translation under the current line (uses Google Translate's public web endpoint).
enabled = false
# Target language code: "hi", "es", "ja", "fr", ...
target = "hi"

[backdrop]
# Slow zoom on the album-art backdrop (40 s in, 40 s out).
motion = true

[screensaver]
# After idle_minutes without input, lift the lyrics above all windows as an ambient display;
# drop back to the desktop layer as soon as you touch the mouse or keyboard.
enabled = false
idle_minutes = 10

[web]
# Shared listening page: open http://<this-machine>:<port>/ on a phone or laptop on the same network
# to follow the lyrics live. Off by default. Use bind = "127.0.0.1" to keep it local.
enabled = false
port = 8765
bind = "0.0.0.0"
