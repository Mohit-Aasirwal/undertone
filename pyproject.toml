[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "undertone"
version = "1.1.0"
description = "Desktop-layer lyrics lightbox with an audio-reactive ring visualizer for Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mohit Aasirwal" }]
keywords = ["lyrics", "mpris", "spotify", "visualizer", "gtk", "desktop", "linux"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
# PyGObject (gi) is deliberately not listed: install it from your distro (see README).
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/Mohit-Aasirwal/undertone"
Issues = "https://github.com/Mohit-Aasirwal/undertone/issues"

[project.scripts]
undertone = "undertone.app:main"

[tool.setuptools.packages.find]
include = ["undertone*"]
