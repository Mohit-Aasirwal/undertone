name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Releases are created by hand (gh release create) so they are authored by the maintainer.
# CI only tests, and on tags builds the artifacts and keeps them on the workflow run.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - run: python3 -m unittest discover -s tests -t . -v

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build
      - run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: undertone-${{ github.ref_name }}
          path: dist/*
