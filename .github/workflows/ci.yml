name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - run: python3 -m unittest discover -s tests -t . -v

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build
      - run: ./packaging/build-deb.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
