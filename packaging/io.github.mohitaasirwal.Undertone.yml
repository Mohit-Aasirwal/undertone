# Flatpak manifest for Flathub. Build offline-capable: every source is pinned and hashed.
# Local build:  flatpak-builder --user --install --force-clean build-dir packaging/io.github.mohitaasirwal.Undertone.yml
# Not built on the author's machine (no flatpak-builder there); see packaging/flathub/README.md.
app-id: io.github.mohitaasirwal.Undertone
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: undertone
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network                        # lyrics, translations, the shared page
  - --talk-name=org.mpris.MediaPlayer2.*   # read every player's state
  - --own-name=org.undertone               # the ctl interface
  - --filesystem=xdg-music:ro              # local .lrc files
  - --filesystem=xdg-config/autostart:create
  - --talk-name=org.freedesktop.ScreenSaver
modules:
  - name: python3-numpy
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-build-isolation numpy
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/0f/50/de23fde84e45f5c4fda2488c759b69990fd4512387a8632860f3ac9cd225/numpy-1.26.4-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
        sha256: 675d61ffbfa78604709862923189bad94014bef562cc35cf61d3a07bba02a7ed
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/79/f8/97f10e6755e2a7d027ca783f63044d5b1bc1ae7acb12afe6a9b4286eac17/numpy-1.26.4-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl
        sha256: 9fad7dcb1aac3c7f0584a5a8133e3a43eeb2fe127f47e3632d43d677c66c102b
        only-arches: [aarch64]
  - name: undertone
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/flathub/io.github.mohitaasirwal.Undertone.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 packaging/flathub/io.github.mohitaasirwal.Undertone.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 packaging/flathub/io.github.mohitaasirwal.Undertone.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps
    sources:
      - type: git
        url: https://github.com/Mohit-Aasirwal/undertone.git
        tag: v1.2.0
